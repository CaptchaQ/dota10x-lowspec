// =============================================================
//  autoexec.cfg  ::  Dota 2 low-spec / multi-instance preset
//  Tested cvars + safe game options. Visual-only changes.
//  Place into:
//     ...\Steam\steamapps\common\dota 2 beta\game\dota\cfg\autoexec.cfg
//  Then add  +exec autoexec  to launch options.
// =============================================================

// ---------- Engine / rendering ----------
fps_max                                  120                  // hard cap; per-instance lowering reduces CPU pressure when running many clients
fps_max_ui                               60                   // UI/menu cap
mat_vsync                                0
mat_triplebuffered                       0
mat_powersavingsmode                     0
r_low                                    1                    // global low-quality flag (Source 2)
r_dota_outline                           0                    // disable hero outlines that re-render frame
r_dota_render_outline                    0
r_deferred_simple_lights                 1                    // simpler local light shader
r_deferred_height_fog_enable             0                    // remove height fog
r_csgo_water_refraction                  0
cl_globallight_shadow_mode               0                    // hard shadows -> off
cl_globallight_shadow_quality            0
r_shadow_quality                         0
r_dynamic                                0                    // disable dynamic lights from spells/torches
mat_motion_blur_enabled                  0
mat_motion_blur_strength                 0
r_pix_enable                             0
r_postprocess_enable                     0                    // disables post-process FX (bloom, color grading)
r_water_fastpath                         1
r_water_reflect_actors                   0
r_water_reflect_world                    0
r_water_refraction                       0

// ---------- Particles ----------
r_particle_quality                       0                    // ultra-low particle quality
cl_particles_show_bbox                   0
particle_max_emission_rate               0.5                  // throttles emission globally (anything > 1 is amplification, < 1 dampens)
r_particle_max_detail_level              0
r_particle_high_quality                  0
r_particle_lowq                          1
particle_clip_dist                       1500                 // particles further than 1500 units = culled
mem_max_heapsize                         2048

// ---------- Animations / portraits ----------
dota_portrait_animate                    0
dota_hero_loadout_perf_setup             1
dota_use_animgraph                       1
dota_force_right_click_attack            1                    // less click misclicks; QoL not perf
dota_unit_use_player_color               1
cl_dota_alt_unit_movetodirection         1

// ---------- World / minimap / fog ----------
fog_enableskybox                         0
fog_volume_use_temporal                  0
dota_screen_shake                        0                    // QoL
dota_camera_smooth_count                 1                    // smoother but cheaper than default 8

// ---------- Audio (lighter mixing for many instances) ----------
volume                                   0.05                 // mute when running 10 clients (you can re-enable on the active one)
snd_mixahead                             0.05
snd_mute_losefocus                       1                    // CRITICAL for multi-boxing: only the focused window plays sound
snd_musicvolume                          0
voice_modenable                          0

// ---------- Networking sane defaults ----------
rate                                     196608
cl_updaterate                            30
cl_cmdrate                               30
cl_interp_ratio                          2
cl_interp                                0.0333

// ---------- Engine threading ----------
cl_threaded_bone_setup                   1

// ---------- Stop background work when window unfocused ----------
engine_no_focus_sleep                    50                   // when window inactive, sleep ms between frames -> huge CPU savings on background instances

// ---------- Misc visual cleanup ----------
dota_disable_range_finder                0
dota_minimap_show_hero_icon              1
dota_pain_decay                          0
dota_pain_factor                         0
dota_pain_multiplier                     0
dota_show_hero_finder                    0

echo ============================================================
echo  [autoexec] dota10x low-spec preset loaded
echo ============================================================
